<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">AD 통합 DNS: 질의, 갱신, 복제</title>
<desc id="desc">클라이언트는 DNS DC에 질의하고 승인된 장비 또는 DHCP가 보안 갱신을 요청한다. 영역을 보유한 DC 사이에서는 DNS 영역 데이터를 AD 복제로 전달한다. 모든 이름은 가상 예제다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="1120" height="560" rx="20" fill="#f5f7fb"/>
<g font-family="Malgun Gothic, sans-serif" fill="#17283d">
<text x="45" y="55" font-size="28" font-weight="700">AD 통합 DNS의 세 경로</text>
<text x="45" y="88" font-size="17">설명용 가상 구성 · 같은 영역을 보유한 쓰기 가능한 DNS/DC</text>
<rect x="45" y="170" width="245" height="105" rx="12" fill="#fff" stroke="#64748b"/>
<text x="73" y="212" font-size="22" font-weight="700">Client</text><text x="73" y="245" font-size="17">app01.ad.example.com 질의</text>
<rect x="45" y="365" width="245" height="105" rx="12" fill="#fff" stroke="#19805b"/>
<text x="70" y="406" font-size="20" font-weight="700">승인 장비 / DHCP</text><text x="70" y="440" font-size="17">인증 + 레코드 권한</text>
<rect x="530" y="165" width="240" height="300" rx="14" fill="#fff" stroke="#375b94" stroke-width="2"/>
<rect x="830" y="165" width="240" height="300" rx="14" fill="#fff" stroke="#375b94" stroke-width="2"/>
<text x="560" y="210" font-size="24" font-weight="700">DC01 / DNS</text><text x="860" y="210" font-size="24" font-weight="700">DC02 / DNS</text>
<text x="552" y="258" font-size="18">ad.example.com</text><text x="852" y="258" font-size="18">ad.example.com</text>
<rect x="550" y="352" width="200" height="88" rx="8" fill="#eaf0fa"/><rect x="850" y="352" width="200" height="88" rx="8" fill="#eaf0fa"/>
<text x="574" y="385" font-size="18">AD DS 저장소</text><text x="874" y="385" font-size="18">AD DS 저장소</text>
<text x="568" y="416" font-size="16">DNS 영역 데이터</text><text x="868" y="416" font-size="16">DNS 영역 데이터</text>
<path d="M290 220H515" stroke="#475569" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="341" y="197" font-size="17">질의 / 응답</text>
<path d="M290 415H425V305H515" fill="none" stroke="#19805b" stroke-width="3" marker-end="url(#arrow)"/><text x="321" y="459" font-size="17" fill="#116644">보안 동적 갱신</text>
<path d="M770 310H830" stroke="#375b94" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="763" y="293" font-size="15" fill="#375b94">AD 복제</text>
<text x="45" y="518" font-size="18">갱신 처리와 복제 완료는 별도 검증</text>
<text x="530" y="511" font-size="17">복제 범위 · 파티션 참여 · 복제 상태를 함께 확인</text>
</g></svg>
